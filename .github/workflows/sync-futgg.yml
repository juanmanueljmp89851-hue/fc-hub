name: Sync fut.gg Cards Daily

on:
  schedule:
    # 15:10 Argentina (UTC-3) = 18:10 UTC — después de la actualización del juego (15h AR)
    - cron: "10 18 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás a sincronizar (lookback)"
        required: false
        default: "2"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run fut.gg sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync-futgg.ts --days ${{ github.event.inputs.days || '2' }}

      - name: Summary
        if: always()
        run: echo "fut.gg sync completado $(date -u)"

name: Sync fut.gg Cards Daily

on:
  # EA drops content at 18:00 UK time. GitHub delays scheduled runs by up to ~3h,
  # so crons fire early and the first step waits for the target London time.
  schedule:
    - cron: "0 16 * * *" # → 19:00 London (15:00 ARG in UK summer, 16:00 ARG in winter)
    - cron: "0 18 * * *" # → 21:00 London (17:00 ARG in UK summer, 18:00 ARG in winter), late cards
  push:
    branches: [main]
    paths:
      - "scripts/sync-futgg.ts"
      - ".github/workflows/sync-futgg.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás a sincronizar (lookback)"
        required: false
        default: "2"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Wait for target time
        run: |
          zone=$(TZ=Europe/London date +%Z)
          case "$zone" in BST|GMT) ;; *) echo "::error::Europe/London timezone unavailable (got $zone)"; exit 1 ;; esac
          case "${{ github.event.schedule }}" in
            "0 16 * * *") target="19:00" ;;
            "0 18 * * *") target="21:00" ;;
            *) echo "Not scheduled, running now"; exit 0 ;;
          esac
          target_ts=$(TZ=Europe/London date -d "today $target" +%s)
          wait=$(( target_ts - $(date +%s) ))
          echo "Target $target Europe/London = $(date -u -d @"$target_ts" +%H:%M) UTC, waiting ${wait}s"
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run fut.gg sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync-futgg.ts --days ${{ github.event.inputs.days || '2' }}

      - name: Summary
        if: always()
        run: echo "fut.gg sync completado $(date -u)"

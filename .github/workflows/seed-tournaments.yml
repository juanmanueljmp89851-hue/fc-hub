name: Seed Tournaments to DB

on:
  push:
    branches: [main]
    paths:
      - "scripts/seed-tournaments.ts"
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Seed tournaments to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/seed-tournaments.ts

      - name: Summary
        if: always()
        run: echo "Tournament seed completado $(date -u)"

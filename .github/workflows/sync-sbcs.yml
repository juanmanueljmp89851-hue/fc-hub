name: Sync SBCs Daily

on:
  schedule:
    # Cada 4 horas — SBCs rotan más seguido que cartas
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync SBCs from fut.gg to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync-sbcs.ts

      - name: Summary
        if: always()
        run: echo "SBC sync completado $(date -u)"

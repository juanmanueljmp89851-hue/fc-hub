name: Sync Evolutions Daily

on:
  # EA drops content at 18:00 UK time. GitHub delays scheduled runs by up to ~3h,
  # so crons fire early and the first step waits for the target London time.
  schedule:
    - cron: "0 15 * * *" # → 18:30 London (14:30 ARG in UK summer, 15:30 ARG in winter)
    - cron: "0 17 * * *" # → 20:30 London (16:30 ARG in UK summer, 17:30 ARG in winter)
  push:
    branches: [main]
    paths:
      - "scripts/sync-evolutions.ts"
      - ".github/workflows/sync-evolutions.yml"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Wait for target time
        run: |
          zone=$(TZ=Europe/London date +%Z)
          case "$zone" in BST|GMT) ;; *) echo "::error::Europe/London timezone unavailable (got $zone)"; exit 1 ;; esac
          case "${{ github.event.schedule }}" in
            "0 15 * * *") target="18:30" ;;
            "0 17 * * *") target="20:30" ;;
            *) echo "Not scheduled, running now"; exit 0 ;;
          esac
          target_ts=$(TZ=Europe/London date -d "today $target" +%s)
          wait=$(( target_ts - $(date +%s) ))
          echo "Target $target Europe/London = $(date -u -d @"$target_ts" +%H:%M) UTC, waiting ${wait}s"
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync evolutions from fut.gg to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync-evolutions.ts
